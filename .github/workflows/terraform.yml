name: Terraform (infra)


on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - '**.tf'
      - '.terraform.lock.hcl'
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  # Compte déjà créé à la main dans rg-tfstate (spaincentral), container
  # "tfstate" présent. Le job le réutilise tel quel.
  TFSTATE_SA: tfstatemailmg
  TFSTATE_RG: rg-tfstate
  # La policy « Allowed resource deployment regions » de la souscription
  # n'autorise que : norwayeast, uaenorth, spaincentral, swedencentral,
  # germanywestcentral. westeurope est refusée (RequestDisallowedByAzure).
  # Doit rester cohérent avec le défaut de var.location (variables.tf).
  LOCATION: spaincentral
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: 'true'

jobs:
  # =========================================================================
  # JOB 1 — PLAN (automatique)
  # =========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
      TF_VAR_whatsapp_phone: ${{ secrets.WHATSAPP_PHONE }}
      TF_VAR_callmebot_api_key: ${{ secrets.CALLMEBOT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier que les secrets Azure sont présents
        run: |
          missing=""
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            eval "val=\$$v"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets manquants :$missing"
            echo "::error::Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Secrets Azure présents."

      - name: Connexion Azure
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" -o none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Créer le stockage du state (idempotent)
        run: |
          # `az group create` n'est PAS idempotent quand la région change : il
          # échoue avec InvalidResourceGroupLocation si le groupe existe déjà
          # ailleurs (un resource group ne peut pas être déplacé). On ne le crée
          # donc que s'il est absent. Sa région n'est que de la métadonnée : les
          # ressources qu'il contient peuvent vivre dans une autre région.
          if ! az group show -n "$TFSTATE_RG" -o none 2>/dev/null; then
            az group create -n "$TFSTATE_RG" -l "$LOCATION" -o none --only-show-errors
          else
            echo "Groupe $TFSTATE_RG déjà présent ($(az group show -n "$TFSTATE_RG" --query location -o tsv))."
          fi

          if ! az storage account show -n "$TFSTATE_SA" -g "$TFSTATE_RG" -o none 2>/dev/null; then
            echo "Création du compte de stockage $TFSTATE_SA..."
            # Pas de "|| true" ici : si le nom est déjà pris ailleurs dans Azure,
            # il faut échouer tout de suite avec un message clair plutôt que de
            # planter deux lignes plus loin sur un "ResourceNotFound" obscur.
            az storage account create -n "$TFSTATE_SA" -g "$TFSTATE_RG" -l "$LOCATION" \
              --sku Standard_LRS --allow-blob-public-access false \
              --min-tls-version TLS1_2 -o none --only-show-errors \
            || {
                 echo "::error::Impossible de créer le storage account '$TFSTATE_SA'. Deux causes possibles :"
                 echo "::error::1) RequestDisallowedByAzure -> la région '$LOCATION' est refusée par la policy de la souscription."
                 echo "::error::   Régions autorisées : az policy assignment list --query \"[?displayName=='Allowed resource deployment regions'].parameters\""
                 echo "::error::2) AlreadyExists -> le nom est déjà pris (unique mondialement). Vérifier : az storage account check-name --name $TFSTATE_SA"
                 exit 1
               }
          fi

          KEY=$(az storage account keys list -n "$TFSTATE_SA" -g "$TFSTATE_RG" --query "[0].value" -o tsv)
          az storage container create -n tfstate \
            --account-name "$TFSTATE_SA" --account-key "$KEY" -o none --only-show-errors

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=agent-pa.tfstate"

      - name: Terraform fmt (non bloquant)
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color \
            | tee "$RUNNER_TEMP/plan.txt"

      - name: Publier le plan dans le résumé du job
        if: always()
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null || echo "(plan indisponible)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # JOB 2 — APPLY (manuel : attend une approbation)
  #
  # Note : l'apply recalcule son propre plan au lieu de réutiliser un fichier
  # tfplan produit par le job "plan". C'est volontaire — un fichier de plan
  # contient les valeurs des secrets en clair, et les artefacts GitHub sont
  # lisibles par toute personne ayant accès au dépôt.
  # =========================================================================
  apply:
    name: Apply (approbation requise)
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest


    environment: production

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
      TF_VAR_whatsapp_phone: ${{ secrets.WHATSAPP_PHONE }}
      TF_VAR_callmebot_api_key: ${{ secrets.CALLMEBOT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion Azure
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" -o none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=agent-pa.tfstate"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      - name: Publier les outputs
        if: success()
        run: |
          {
            echo "## Ressources déployées"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
